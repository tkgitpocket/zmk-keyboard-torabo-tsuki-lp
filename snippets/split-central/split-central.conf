CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# DYA Studio Level 2: Studio RPCはcentral側でのみ必要な機能なのでこちらに集約
# （torabo-tsuki-lp本家のv0.3+dya-studioブランチと同じ構成）
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# DYA Studio: Combo編集・キー入力ストリーム表示・機体情報表示
# （CONFIG_ZMK_RUNTIME_COMBOがzmk-feature-custom-settingsを自動選択するため
#  custom-settings側のCONFIG_ZMK_CUSTOM_SETTINGS=yは明示不要）
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# DYA Studio: マクロ編集。ZMK_RUNTIME_MACRO_MAX_BYTES(既定256)の許容範囲は
# custom-settingsのCONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZEまでなので
# （未設定だと既定64にクランプされビルドエラーになる）明示的に増やす
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y

# DYA Studio: 診断用ポップアップ。CONFIG_ZMK_DEVTOOL_LAYER_STATE（レイヤー状態RPC）
# とCONFIG_ZMK_DEVTOOL_LOG_CAPTURE（ログ表示）はどちらもこのZMKフォーク・Zephyr
# バージョンと非互換のため明示的にn（Studioロック状態の確認/切替のみ有効。
# 詳細はmemos/dya-studio-integration.md）。
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_LAYER_STATE=n
CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=n
