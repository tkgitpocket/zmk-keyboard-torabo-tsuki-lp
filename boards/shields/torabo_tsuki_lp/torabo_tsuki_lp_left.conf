CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=43200000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_MAX_MV=1400
CONFIG_ZMK_NON_LIPO_LOW_MV=900

CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# DYA Studio Level 2: BLEプロファイル管理・設定同期・トラックボール速度調整。
# torabo-tsuki-lp本家のDYA Studio対応ブランチ(v0.3+dya-studio)の設定に合わせている
# （Studio RPC関連のcentral専用設定はsnippets/split-central/split-central.confへ。
#  詳細はmemos/dya-studio-integration.md）。
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000