manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: kot149
      url-base: https://github.com/kot149
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # DYA Studio(Level 2)対応のため、公式ZMK v0.3ではなくcormoran氏のフォークを使用。
    # 当初はv0.3-branch+custom-studio-protocol+bleを自己判断で選定したが、実機で
    # 接続不安定・タイムアウト等の問題が発生した。torabo-tsuki-lp本家(sekigon-gonnoc)に
    # 実際にDYA Studio対応済みブランチ(v0.3+dya-studio)が存在することが判明し、
    # そちらが使っているv0.3-branch+dyaに変更した。本家が実機検証済みの構成であり、
    # 以下のモジュール群もこの組み合わせで動作確認されている
    # （参考: https://github.com/sekigon-gonnoc/zmk-keyboard-torabo-tsuki-lp/tree/v0.3+dya-studio
    #  詳細はmemos/dya-studio-integration.md）。
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml
    # DYA Studio Level 2: BLEプロファイル管理・設定同期・トラックボール速度調整。
    # zmk-module-ble-management・zmk-module-runtime-input-processorは、mainブランチ
    # HEADが（DYA本体が使う）ZMK本家main相当のより新しいコアAPI
    # （zmk_keymap_layer_activateの2引数版、zmk_endpoint_*の単数形命名等）に依存して
    # おり、v0.3ベースの本フォークとはリンクエラーになるため、両モジュールともその
    # 変更が入る前のコミットに固定している（詳細はmemos/dya-studio-integration.md）。
    # zmk-module-settings-rpcはそのようなAPIを使っておらずmainのままで問題ない。
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 2147ba7d329253ef9d0cfe4c6b814add7915225c
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: dbf92f764de8b6ffd60bf5850514302875fe2570
    # DYA Studio Level 2: Combo編集・キー入力ストリーム表示・機体情報表示。
    # zmk-feature-runtime-comboはzmk-feature-custom-settingsに依存する。
    # custom-settingsのmainブランチHEADは内部でzephyr_linker_sources(ROM_SECTIONS ...)
    # を呼ぶが、ROM_SECTIONSはこのキーボードが使うZephyr v3.5.0+zmk-fixesの
    # extensions.cmakeには存在しない（より新しいZephyrで追加されたリンカ配置先）。
    # ROM_SECTIONS移行前の最終コミットに固定（runtime-comboが呼ぶ全APIの存在は
    # 確認済み。詳細はmemos/dya-studio-integration.md）。
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: 02cc69f210f96f0a1f9332c35fdef31890f42877
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
    - name: zmk-feature-input-stream
      remote: cormoran
      revision: main
    # zmk-feature-device-infoもmainブランチHEADは同様にzephyr_linker_sources(ROM_SECTIONS
    # ...)（GNU build-idをビルドに埋め込む機能）を使い非互換なため、その機能が入る前の
    # コミットに固定。device-infoはZMKコアAPIを一切呼ばないため機能面での実質的な差分は
    # build-id埋め込みのみ（詳細はmemos/dya-studio-integration.md）。
    - name: zmk-feature-device-info
      remote: cormoran
      revision: b1bb753608c3d57a8071419405eb8b3b4bd5a961
    - name: zmk-component-bmp-boost
      remote: sekigon-gonnoc
      import: west.yml
      revision: v0.2
    - name: zmk-feature-status-led
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: torabo-tsuki
    - name: zmk-driver-iqs7211e
      remote: sekigon-gonnoc
    - name: zmk-feature-cdc-acm-bootloader-trigger
      remote: sekigon-gonnoc
      revision: v0.2
    - name: zmk-feature-non-lipo-battery-management
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-scroll-snap
      remote: kot149
      revision: v1
    - name: zmk-layout-shift
      remote: kot149
      revision: v2
  self:
    path: config
