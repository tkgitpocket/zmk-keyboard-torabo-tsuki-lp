manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: kot149
      url-base: https://github.com/kot149
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # DYA Studio(Level 2)対応のため、公式ZMK v0.3ではなくcormoran氏のフォーク
    # （v0.3タグ + Custom Studio Protocol + BLE管理拡張の追加的パッチ）を使用。
    # Zephyrのバージョンは公式v0.3と同一(v3.5.0+zmk-fixes)で、split/BLE/studio関連の
    # 追加のみのためドライバ・他社製モジュールへの影響は小さいと判断（詳細はmemos参照）。
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+custom-studio-protocol+ble
      import: app/west.yml
    # DYA Studio Level 2: BLEプロファイルの一覧表示・名前付け・切替・ペア解除をWeb UIから。
    # mainブランチHEADは zmk_endpoint_get/set_preferred_transport（単数形）を呼ぶが、
    # このキーボードが使うZMKフォークには zmk_endpoints_get_preferred_transport等
    # （複数形）しか無くリンクエラーになる。複数形呼び出しに直した最後のコミットに固定
    # （詳細はmemos/dya-studio-integration.md）。
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 2147ba7d329253ef9d0cfe4c6b814add7915225c
    - name: zmk-component-bmp-boost
      remote: sekigon-gonnoc
      import: west.yml
      revision: v0.2
    - name: zmk-feature-status-led
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: torabo-tsuki
    - name: zmk-driver-iqs7211e
      remote: sekigon-gonnoc
    - name: zmk-feature-cdc-acm-bootloader-trigger
      remote: sekigon-gonnoc
      revision: v0.2
    - name: zmk-feature-non-lipo-battery-management
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-scroll-snap
      remote: kot149
      revision: v1
    - name: zmk-layout-shift
      remote: kot149
      revision: v2
  self:
    path: config
